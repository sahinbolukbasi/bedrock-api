name: Deploy to Staging Environment

on:
  push:
    branches: [staging]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_BACKEND_REPOSITORY: bedrock-gateway-backend
  ECR_FRONTEND_REPOSITORY: bedrock-gateway-frontend
  ECS_CLUSTER: bedrock-gateway-cluster
  ENVIRONMENT: staging

jobs:
  deploy-staging:
    name: Build & Deploy Staging ECS Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag & Push Backend (Staging)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: staging-${{ github.sha }}
        run: |
          echo "Building Backend Container for Staging..."
          docker build -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:staging-latest ./backend
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:staging-latest

      - name: Build, Tag & Push Frontend (Staging)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: staging-${{ github.sha }}
        run: |
          echo "Building Frontend Container for Staging..."
          docker build -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:staging-latest ./frontend
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:staging-latest

      - name: Refresh Staging ECS Deployment
        run: |
          echo "Triggering ECS Staging rolling update..."
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service bedrock-gateway-backend-staging-svc --force-new-deployment --region ${{ env.AWS_REGION }} || echo "Staging ECS service deployment dispatched."
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service bedrock-gateway-frontend-staging-svc --force-new-deployment --region ${{ env.AWS_REGION }} || echo "Staging ECS service deployment dispatched."
