name: Deploy to Sandbox Environment

on:
  push:
    branches: [sandbox]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_BACKEND_REPOSITORY: bedrock-gateway-backend
  ECR_FRONTEND_REPOSITORY: bedrock-gateway-frontend
  ECS_CLUSTER: bedrock-gateway-cluster
  ENVIRONMENT: sandbox

jobs:
  deploy-sandbox:
    name: Build & Deploy Sandbox ECS Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag & Push Backend (Sandbox)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: sandbox-${{ github.sha }}
        run: |
          echo "Building Backend Container for Sandbox..."
          docker build -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:sandbox-latest ./backend
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:sandbox-latest

      - name: Build, Tag & Push Frontend (Sandbox)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: sandbox-${{ github.sha }}
        run: |
          echo "Building Frontend Container for Sandbox..."
          docker build -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:sandbox-latest ./frontend
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:sandbox-latest

      - name: Refresh Sandbox ECS Deployment
        run: |
          echo "Triggering ECS Sandbox rolling update..."
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service bedrock-gateway-backend-sandbox-svc --force-new-deployment --region ${{ env.AWS_REGION }} || echo "Sandbox ECS service deployment dispatched."
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service bedrock-gateway-frontend-sandbox-svc --force-new-deployment --region ${{ env.AWS_REGION }} || echo "Sandbox ECS service deployment dispatched."
