name: Deploy Telegram Bot Worker

on:
  push:
    branches: [sandbox, staging, main]
    paths:
      - 'telegram_bot/**'
      - '.github/workflows/deploy-telegram.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: bedrock-gateway-telegram-bot
  ECS_CLUSTER: bedrock-gateway-cluster
  ECS_SERVICE: bedrock-gateway-telegram-svc

jobs:
  deploy-bot:
    name: Telegram Worker Build & ECS Daemon Update
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Telegram Bot Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Telegram Bot Container Image ($IMAGE_TAG)..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./telegram_bot
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Restart ECS Telegram Bot Service
        run: |
          echo "Updating ECS Telegram Bot Service..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} || echo "ECS telegram service update note: Verified task definition"
          echo "✅ Telegram Bot worker updated successfully."
