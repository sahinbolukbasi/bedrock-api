name: Deploy to AWS ECS with Dynamic Secrets Manager Sync

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_BACKEND_REPOSITORY: bedrock-gateway-backend
  ECR_FRONTEND_REPOSITORY: bedrock-gateway-frontend
  ECS_CLUSTER: bedrock-gateway-cluster
  SECRET_NAME: bedrock-gateway-secrets-prod

jobs:
  deploy:
    name: Sync Secrets from AWS, Build, Push & Refresh ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch Dynamic Secrets from AWS Secrets Manager
        id: fetch-secrets
        run: |
          echo "Fetching latest configuration and variables from AWS Secrets Manager (${{ env.SECRET_NAME }})..."
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id ${{ env.SECRET_NAME }} --query SecretString --output text)
          
          # Extract variables and export for build steps
          ADMIN_EMAIL=$(echo "$SECRET_JSON" | jq -r '.ADMIN_EMAIL // empty')
          ENVIRONMENT=$(echo "$SECRET_JSON" | jq -r '.ENVIRONMENT // "production"')
          
          echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_ENV
          echo "Successfully synchronized variables from AWS Secrets Manager."

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Backend Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Backend Container Image..."
          docker build -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest ./backend
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest

      - name: Build, Tag, and Push Frontend Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Frontend Container Image..."
          docker build -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest ./frontend
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest

      - name: Force Refresh ECS Deployment
        run: |
          echo "Refreshing ECS Tasks with new container images and latest AWS Secrets Manager parameters..."
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service bedrock-gateway-backend-svc --force-new-deployment --region ${{ env.AWS_REGION }} || echo "ECS service will be created on initial terraform apply."
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service bedrock-gateway-frontend-svc --force-new-deployment --region ${{ env.AWS_REGION }} || echo "ECS service will be created on initial terraform apply."
