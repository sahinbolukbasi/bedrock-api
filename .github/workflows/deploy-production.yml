name: Production GitOps Deployment

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_BACKEND_REPOSITORY: bedrock-gateway-backend
  ECR_FRONTEND_REPOSITORY: bedrock-gateway-frontend
  ECS_CLUSTER: bedrock-gateway-cluster
  SECRET_NAME: bedrock-gateway-secrets-prod
  ENVIRONMENT: production

jobs:
  deploy-production:
    name: Production Release & Zero-Downtime ECS Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch Dynamic Secrets from AWS Secrets Manager
        id: fetch-secrets
        run: |
          echo "Fetching production configurations from AWS Secrets Manager..."
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id ${{ env.SECRET_NAME }} --query SecretString --output text)
          ADMIN_EMAIL=$(echo "$SECRET_JSON" | jq -r '.ADMIN_EMAIL // empty')
          echo "Successfully validated production secrets."

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Backend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Production Backend Image ($IMAGE_TAG)..."
          docker build -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest ./backend
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest

      - name: Build, Tag, and Push Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Production Frontend Image ($IMAGE_TAG)..."
          docker build -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest ./frontend
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest

      - name: Force Zero-Downtime Rolling ECS Deployment
        run: |
          echo "Triggering Zero-Downtime ECS Rolling Update for Production Services..."
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service bedrock-gateway-backend-svc --force-new-deployment --region ${{ env.AWS_REGION }}
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service bedrock-gateway-frontend-svc --force-new-deployment --region ${{ env.AWS_REGION }}
          echo "✅ Production services update triggered successfully."
