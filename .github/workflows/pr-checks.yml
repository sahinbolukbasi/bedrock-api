name: PR Quality Gate & Security Checks

on:
  pull_request:
    branches: [main, staging, sandbox]
    types: [opened, synchronize, reopened]

jobs:
  # -------------------------------------------------------------
  # 1. Backend Verification & Quality
  # -------------------------------------------------------------
  backend-quality:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: bedrock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest-cov flake8

      - name: Lint Python Code (Flake8)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # Complexity check
          flake8 backend --count --exit-zero --max-complexity=15 --max-line-length=160 --statistics

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: backend
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ENVIRONMENT: test
          SECRET_KEY: ci-secret-key-32-characters-minimum
          AWS_REGION: us-east-1
          TELEGRAM_BOT_TOKEN: test_bot_token_123456
          METRICS_SCRAPE_TOKEN: bedrock-metrics-secret-token-key-2026
        run: |
          PYTHONPATH=backend pytest backend/tests/ -v

  # -------------------------------------------------------------
  # 2. Frontend Verification & Next.js Build
  # -------------------------------------------------------------
  frontend-quality:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Typecheck TypeScript
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Next.js Production Build Validation
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          cd frontend
          npm run build

  # -------------------------------------------------------------
  # 3. Security & Dependency Vulnerability Scan
  # -------------------------------------------------------------
  security-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
