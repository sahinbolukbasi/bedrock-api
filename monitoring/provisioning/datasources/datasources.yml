apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    jsonData:
      httpMethod: POST
    editable: true

  - name: CloudWatch
    type: cloudwatch
    access: proxy
    isDefault: false
    jsonData:
      authType: default
      defaultRegion: us-east-1
      logGroups:
        - /ecs/bedrock-gateway
    editable: true
